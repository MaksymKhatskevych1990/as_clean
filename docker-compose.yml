services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "0"
      FRONTEND_DIST: /app/frontend/dist
      DJANGO_SQLITE_PATH: /app/backend/data/db.sqlite3
    volumes:
      - sqlite-data:/app/backend/data
      - media-data:/app/backend/media
    restart: unless-stopped

volumes:
  sqlite-data:
  media-data:
